<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#054239" />
    <meta name="description" content="كل ما تحتاجه من خدمات صحية في مدينة طيبة الإمام... في مكان واحد. دليل طبي رقمي شامل يربطك بالأطباء والعيادات والصيدليات والمشافي." />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="دلیل طیبة Emanuel الطبي" />
    <meta property="og:description" content="كل ما يحتاجه منخدمات صحية في مدينة طيبة Imam في مكان واحد." />
    <meta property="og:site_name" content="دلیل طیبة Emanuel الطبي" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>دلیل طیبة Emanuel الطبي</title>
    <style>
      #splash {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 14px;
        padding: 24px;
        text-align: center;
        background: linear-gradient(165deg, #054239 0%, #032b25 100%);
        color: #fff;
        font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
        transition: opacity 0.6s ease;
      }
      #splash.hide {
        opacity: 0;
        pointer-events: none;
      }
      #splash img {
        width: 72px;
        height: 72px;
        animation: splashPulse 1.6s ease-in-out infinite;
      }
      #splash h1 {
        margin: 0;
        font-size: 26px;
        font-weight: 700;
        letter-spacing: 0.2px;
      }
      #splash p {
        margin: 0;
        max-width: 420px;
        font-size: 14px;
        font-weight: 400;
        line-height: 1.9;
        opacity: 0.82;
      }
      #splash .bar {
        width: 170px;
        height: 3px;
        margin-top: 12px;
        border-radius: 99px;
        background: rgba(255, 255, 255, 0.16);
        overflow: hidden;
      }
      #splash .bar::after {
        content: '';
        display: block;
        height: 100%;
        width: 45%;
        border-radius: 99px;
        background: #b9a779;
        animation: splashBar 1.3s ease-in-out infinite;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); opacity: 0.92; }
        50% { transform: scale(1.1); opacity: 1; }
      }
      @keyframes splashBar {
        0% { transform: translateX(130%); }
        100% { transform: translateX(-320%); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <div id="splash" aria-hidden="true">
      <img src="/favicon.svg" alt="" />
      <h1>أهلاً بك في دليل طيبة Emanuel الطبي</h1>
      <p>كل ما يحتاجه منخدمات صحية في مدينة طيبة Emanuel — أطباء وعيادات وصيدليات ومخابر ونصائح طبية، في مكان واحد.</p>
      <div class="bar"></div>
      <p style="margin-top: 16px; font-size: 11px; opacity: 0.6;">تم تطوير المنصة من قبل م. قصي مهند الصالح</p>
    </div>
    <noscript><style>#splash { display: none; }</style></noscript>
    <script type="module" src="/src/main.tsx"></script>
    <script>
      (function () {
        setTimeout(function () {
          var el = document.getElementById('splash');
          if (!el) return;
          el.classList.add('hide');
          setTimeout(function () { el.remove(); }, 650);
        }, 3000);
      })();
    </script>
  </body>
</html>
